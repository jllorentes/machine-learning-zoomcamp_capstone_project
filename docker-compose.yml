services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.notebook
    container_name: capstone-notebook
    ports:
      - "8888:8888"
    volumes:
      - ./:/workspace
      - /workspace/.venv
      - ./data:/workspace/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - KAGGLE_CONFIG_DIR=/workspace
    restart: unless-stopped