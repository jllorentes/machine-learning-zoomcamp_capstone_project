[project]
name = "ml-workspace"
version = "0.1.0"
description = "SmartClaim microservice dependencies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.1",
    "requests>=2.32.5",
    "uvicorn>=0.38.0",
    "numpy>=1.24.0",
    "xgboost>=2.0.0",
    "wget>=3.2",
    "unidecode",
    "tqdm",
    "onnxruntime>=1.16.0",
    "pillow>=10.1.0",
    "kaggle>=1.8.3",
    "python-multipart>=0.0.21",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "onnxscript>=0.5.7",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
